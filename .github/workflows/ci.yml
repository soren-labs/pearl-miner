name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Run Rust unit tests
        run: cargo test --locked -p pearl-miner-core

      - name: Check Rust formatting
        run: cargo fmt -p pearl-miner-core --check

      - name: Lint Rust core
        run: cargo clippy --locked -p pearl-miner-core --all-targets --no-deps -- -D warnings

      - name: Build release core binary
        run: cargo build --locked --release -p pearl-miner-core

      - name: Build macOS SwiftUI app
        run: swift build --package-path macos -c release
