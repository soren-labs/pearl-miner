[package]
name = "pearl-miner-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust + Metal GPU mining engine for Pearl (PRL) on Apple Silicon"

[dependencies]
anyhow = "1.0"
base64 = "0.21"
bech32 = "0.11"
bincode = "1.3.3"
blake3 = { version = "1.8", features = ["rayon"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"
hex = "0.4"
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
libc = "0.2"
pearl-blake3 = { path = "../vendor/pearl/pearl-blake3", features = ["serde"] }
primitive-types = "0.12.1"
rand = "0.9.2"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "2.10", features = ["json"] }
zk-pow = { path = "../vendor/pearl/zk-pow" }

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["disable_initial_exec_tls"] }

[build-dependencies]
cc = "1.0"
